[package]
name = "gst-plugin-overlaycompositor"
version.workspace = true
authors = ["Seungha Yang <seungha@centricular.com>"]
repository.workspace = true
license = "MPL-2.0"
edition.workspace = true
rust-version.workspace = true
description = "GStreamer overlay composition blending plugin"

[dependencies]
atomic_refcell = "0.1"
gst.workspace = true
gst-video.workspace = true

[dev-dependencies]
gst-check.workspace = true

[lib]
name = "gstoverlaycompositor"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper.workspace = true

[features]
static = []
capi = []
doc = ["gst/v1_18"]
v1_30 = ["gst/v1_30"]

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-video-1.0, gobject-2.0, glib-2.0, gmodule-2.0"
