[package]
name = "gst-plugin-analytics"
version.workspace = true
authors = ["Benjamin Gaignard <benjamin.gaignard@collabora.com>", "Sebastian Dröge <sebastian@centricular.com>"]
repository.workspace = true
license = "MPL-2.0"
description = "GStreamer Rust Analytics Plugin"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "gstrsanalytics"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
gst = { workspace = true, features = ["v1_24"] }
gst-base = { workspace = true, features = ["v1_24"] }
gst-video = { workspace = true, features = ["v1_24"] }
gst-analytics = { workspace = true }
xmltree = "0.12"
glib = { workspace = true, features = ["v2_62"] }
byte-slice-cast = "1"
itertools = "0.15"
smol_str = { version = "0.3", optional = true }
geo = { version = "0.33", default-features = false, optional = true }

[target.'cfg(all(target_pointer_width = "64", any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "windows", target_os = "linux")))'.dependencies]
gst-hip = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
gst-d3d12.workspace = true
windows = { version = ">= 0.61, <= 0.62", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi_Common"] }

[dev-dependencies]
gst-check.workspace = true
tempfile = "3"

[build-dependencies]
gst-plugin-version-helper.workspace = true

[features]
static = []
capi = []
doc = []
hip = ["v1_30", "dep:gst-hip"]
v1_28 = ["gst-analytics/v1_28"]
v1_30 = ["v1_28", "gst/v1_30", "gst-video/v1_30", "gst-d3d12/v1_30", "gst-analytics/v1_30", "dep:smol_str", "dep:geo"]

[[test]]
name = "analyticscombiner"
required-features = ["v1_28"]

[[test]]
name = "analyticssplitter"
required-features = ["v1_28"]

[[test]]
name = "tensordecodebin"
required-features = ["v1_28"]

[[test]]
name = "bytetracker"
required-features = ["v1_30"]

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-base-1.0, gobject-2.0, glib-2.0, gmodule-2.0, gstreamer-analytics-1.0"
